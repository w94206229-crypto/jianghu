function contextQuestLine(n){if(GAME.scene==='village'&&!GAME.flags.talkVillage)return'年轻人，若想出村闯荡，先去武馆熟悉拳脚，再替村里处理一只伤人的野狗。';if(GAME.scene==='bandit')return'山寨里机关不多，难的是几个守路的悍匪。';return'江湖上的事情看似杂乱，其实总有一条线索相连。'}
function heroLine(n){if(!hasItem('hero_token'))return'英雄坛不拒后来者，但登记需要英雄帖，也要有足够名声。';return'既有英雄帖，便可登记入坛。榜上名次只认胜负，不认来历。'}
function smithAt(){const n=GAME.forgeCount||0,cost=Math.round(80*Math.pow(1.4,n));if(hasItem('ore',2)&&GAME.money>=cost){removeItem('ore',2);addMoney(-cost);GAME.atk+=1;GAME.def+=1;GAME.forgeCount=n+1;toast(`兵刃护具锻成：攻防永久 +1（已锻造 ${n+1} 次，下次需 ${Math.round(80*Math.pow(1.4,n+1))} 文）`,'good')}else toast(`需要铁矿石×2 与 ${cost} 文（锻造价随次数递增）`,'warn')}
function factionAt(n){if(GAME.faction!=='none'){if(MAP_DEFS[GAME.scene].type==='faction'&&FACTIONS[GAME.faction]?.map===GAME.scene){GAME.contribution+=1;toast('完成一次门内请益，贡献 +1','good')}else toast(`你已是${FACTIONS[GAME.faction].name}门下`,'warn');return}const entry=Object.entries(FACTIONS).find(([k,v])=>v.map===GAME.scene);if(!entry){toast('这里不是可加入的门派','warn');return}const [id,f]=entry,req=f.req||{};let ok=true,why='';for(const [k,v] of Object.entries(req)){if(k==='morality'&&v>=0&&GAME.morality<v){ok=false;why=`善恶需达到 ${v}`};if(k==='morality'&&v<0&&GAME.morality>v){ok=false;why=`善恶需低于 ${v}`};if(k==='insight'&&GAME.insight<v){ok=false;why=`悟性需达到 ${v}`};if(k==='agi'&&GAME.agi<v){ok=false;why=`身法需达到 ${v}`};if(k==='fame'&&GAME.fame<v){ok=false;why=`名声需达到 ${v}`}}if(!ok){toast(`入门条件不足：${why}`,'warn');return}GAME.faction=id;GAME.flags.factionVisited=true;GAME.flags.factionJoined=true;GAME.contribution=5;addItem('recommend',1);addFame(8);toast(`拜入 ${f.name}`,'good');closeDialog();updateQuestLogic()}
function officerAt(){GAME.flags.banditKnown=true;if(GAME.flags.banditBoss){if(hasItem('bandit_seal')){removeItem('bandit_seal',1);addMoney(500);addFame(30);addMorality(8);if(!hasItem('hero_token')){addItem('hero_token',1);GAME.flags.heroToken=true}toast('黑风寨悬赏已结清','good')}}else toast('官府悬赏：黑风寨匪患，带回寨主令牌可领赏','warn');updateQuestLogic()}
function escortAt(){if(GAME.sta<20){toast('体力不足，先休息','bad');return}if(!GAME.flags.banditKnown)GAME.flags.banditKnown=true;GAME.sta-=18;if(chance(.42)){closeDialog();startCombat(chance(.25)?'elite':'bandit',{escort:true})}else{let pay=75+Math.floor(Math.random()*60);addMoney(pay);addFame(3);GAME.contribution+=1;toast(`押镖平安抵达，酬银 ${pay}`,'good')}}
function gambleAt(){let stake=50;if(GAME.money<stake){toast('至少需要 50 文下注','bad');return}addMoney(-stake);let roll=Math.ceil(Math.random()*6)+Math.ceil(Math.random()*6),win=roll>=8;if(win){let gain=stake*2;addMoney(gain);toast(`点数 ${roll}，赢得 ${gain} 文`,'good')}else toast(`点数 ${roll}，这一局输了`,'bad');if(chance(.08+GAME.luck*.003)){addFame(1);toast('赌桌旁有人记住了你的手气','good')}}
function transportAt(){const destinations=Object.keys(GAME.visited).filter(id=>id!==GAME.scene&&['city','dock','desert','village'].includes(id));if(!destinations.length){toast('尚未发现可直达的远方地点','warn');return}let to=destinations[destinations.length-1],cost=45;if(GAME.money<cost){toast('船资不足','bad');return}addMoney(-cost);GAME.scene=to;GAME.x=MAP_DEFS[to].spawn.x;GAME.y=MAP_DEFS[to].spawn.y;closeDialog();buildScene()}
function gateAt(n){if(GAME.scene==='village'){if(GAME.flags.dog){GAME.flags.permit=true;addFame(4);toast('守卫认可了你的本事，可以出村了','good')}else toast('先处理村外野狗，再来谈出村','warn')}else if(GAME.scene==='hero'){if(hasItem('hero_token')){GAME.flags.heroPass=true;toast('英雄帖验证无误，可入坛挑战','good')}else toast('没有英雄帖，不能登记挑战','bad')}else toast('守卫放行','good');updateQuestLogic()}
function secretAt(){if(GAME.lastSecretDay===GAME.time.day){toast('今日已请益过奇遇，明日再来','warn');return}GAME.lastSecretDay=GAME.time.day;if(GAME.insight+GAME.luck>=22&&chance(.55)){if(!GAME.skills.wind_step){GAME.skills.wind_step=1;GAME.activeSkills.push('wind_step');toast('你从只言片语中领悟了「逐风身法」','good')}else{GAME.exp+=80;GAME.insight+=1;toast('奇人点拨：悟性 +1，经验 +80','good')}}else toast('对方只笑了笑：缘分未到。','warn')}
function rumorAt(){const text=CONTENT.rumors[(GAME.time.day*7+GAME.fame+GAME.scene.length)%CONTENT.rumors.length];message(text,3800);if(chance(.12)){GAME.flags.banditKnown=true;toast('获得黑风寨相关线索','good')}}
function heroAt(n){if(!GAME.flags.heroPass){if(hasItem('hero_token')){GAME.flags.heroPass=true;toast('完成英雄坛登记','good')}else{toast('先取得英雄帖','warn');return}}if(GAME.flags.heroWins<3){closeDialog();startCombat('challenger',{heroRank:true});return}if(!GAME.flags.guardian){closeDialog();startCombat('guardian',{guardian:true});return}if(!GAME.flags.master){closeDialog();startCombat('master',{master:true});return}finishGame()}
function openShop(type){const ids=SHOPS[type]||SHOPS.general;$('#shopTitle').textContent={general:'杂货铺',medicine:'药铺',weapon:'兵器铺',book:'书局',black:'夜市暗货',inn:'客栈酒菜'}[type]||'商店';const body=$('#shopBody');body.innerHTML='';const list=document.createElement('div');list.className='list';const d=derive();ids.forEach(id=>{const it=ITEMS[id];let price=Math.max(1,Math.floor(it.price*(type==='black'?1.25:1)*(1-clamp((GAME.insight+GAME.luck-16)*.003,-.08,.12))));const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="main"><strong>${it.name}</strong><small>${it.desc} · 持有 ${GAME.inventory[id]||0}</small></div>`;const acts=document.createElement('div');acts.className='actions';acts.appendChild(btn(`${price}文`,()=>{if(GAME.money<price){toast('银两不足','bad');return}addMoney(-price);addItem(id,1);if(type==='black'&&(id==='poison_powder'||id==='snake_staff_weapon'))addMorality(-1)},'primary'));if((GAME.inventory[id]||0)>0&&it.type!=='quest')acts.appendChild(btn('出售',()=>{removeItem(id,1);addMoney(Math.max(1,Math.floor(price*.45)));openShop(type)}));row.appendChild(acts);list.appendChild(row)});body.appendChild(list);openModal('shopModal')}
function openQuiz(){const q=pick(QUIZZES);$('#quizQuestion').textContent=q.q;const box=$('#quizAnswers');box.innerHTML='';q.a.forEach((a,i)=>box.appendChild(btn(a,()=>{if(i===q.i){GAME.insight+=chance(.3)?1:0;GAME.exp+=35;addFame(2);toast('回答正确：经验 +35','good')}else toast('回答不对，夫子让你再想想','warn');closeModal('quizModal')})));openModal('quizModal')}
function updateQuestLogic(){const q=GAME.quests;if(!GAME.flags.talkVillage){q.newbie.stage=0}else if(!GAME.flags.dog){q.newbie.stage=1}else if(!GAME.flags.permit){q.newbie.stage=2}else q.newbie.stage=3;if(GAME.scene==='village'&&UI.dialogData?.npc?.kind==='quest')GAME.flags.talkVillage=true;if(GAME.visited.city)GAME.flags.cityEntered=true;if(GAME.flags.heroPass)q.city.stage=2;else if(GAME.flags.cityEntered)q.city.stage=1;if(GAME.fame>=30&&q.city.stage>=2){q.city.stage=3;if(!GAME.flags.heroToken&&GAME.flags.banditBoss){addItem('hero_token',1);GAME.flags.heroToken=true}}q.faction.stage=GAME.flags.factionSkill?3:GAME.flags.factionJoined?2:GAME.flags.factionVisited?1:0;q.bandit.stage=GAME.flags.banditBoss?3:GAME.visited.bandit?2:GAME.flags.banditKnown?1:0;q.hero.stage=GAME.flags.master?4:GAME.flags.guardian?3:GAME.flags.heroWins>=3?2:GAME.flags.heroPass?1:0;const sig=[q.newbie.stage,q.city.stage,q.faction.stage,q.bandit.stage,q.hero.stage].join('/');if(RUNTIME.questSig!==sig){RUNTIME.questSig=sig;RUNTIME.dirtyHud=true}}
function currentQuest(){for(const id of ['newbie','city','faction','bandit','hero']){const q=GAME.quests[id];if(q.stage<q.steps.length)return q}return GAME.quests.hero}
function refreshHud(){if(!GAME)return;$('#heroName').textContent=GAME.name;$('#heroTitle').textContent=titleByState();$('#hpBar').style.width=(GAME.hp/GAME.maxHp*100)+'%';$('#mpBar').style.width=(GAME.mp/GAME.maxMp*100)+'%';$('#staBar').style.width=(GAME.sta/GAME.maxSta*100)+'%';$('#hpText').textContent=`${Math.ceil(GAME.hp)}/${GAME.maxHp}`;$('#mpText').textContent=`${Math.ceil(GAME.mp)}/${GAME.maxMp}`;$('#staText').textContent=`${Math.ceil(GAME.sta)}/${GAME.maxSta}`;$('#sceneName').textContent=MAP_DEFS[GAME.scene].name;$('#timeText').textContent=`第${GAME.time.day}日 · ${timeName()} · ${RUNTIME.weather}`;$('#moneyText').textContent=formatMoney(GAME.money);$('#fameText').textContent=`名声 ${GAME.fame}`;let q=currentQuest(),s=q.steps[Math.min(q.stage,q.steps.length-1)];$('#questHint').innerHTML=`<b>${q.name}</b><br>${q.stage>=q.steps.length?'已完成':s}`;RUNTIME.dirtyHud=false}
function titleByState(){if(GAME.flags.master)return GAME.morality>=25?'武林盟誉':GAME.morality<=-25?'邪道魁首':'天下第一';if(GAME.title&&GAME.title!=='江湖新人')return GAME.title;if(GAME.fame>=150)return'名动一方';if(GAME.fame>=70)return'江湖少侠';if(GAME.fame>=25)return'后起之秀';return GAME.title}
function timeName(){const h=Math.floor(GAME.time.minute/60);return h<5?'寅夜':h<7?'卯时':h<9?'辰时':h<11?'巳时':h<13?'午时':h<15?'未时':h<17?'申时':h<19?'酉时':h<21?'戌时':'夜深'}
function daylight(){const m=GAME.time.minute;if(m<330||m>1230)return .28;if(m<450)return lerp(.3,1,(m-330)/120);if(m>1080)return lerp(1,.35,(m-1080)/150);return 1}
function drawParticle(g,p){g.save();g.globalAlpha=clamp(p.life/p.max,0,1);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,p.size,0,TAU);g.fill();g.restore()}
function updateParticles(dt){for(const p of RUNTIME.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.2,dt);p.vy*=Math.pow(.2,dt)}RUNTIME.particles=RUNTIME.particles.filter(p=>p.life>0)}
function burstWorld(x,y,color,n=20){for(let i=0;i<n;i++){let a=Math.random()*TAU,s=20+Math.random()*70;RUNTIME.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.5,max:.9,size:2+Math.random()*4,color,type:'spark'})}}
function burstPlayer(color,n=20){burstWorld(GAME.x,GAME.y,color,n)}
function startCombat(enemyId,meta={}){const def=ENEMIES[enemyId];if(!def)return;COMBAT={enemyId,meta,turn:'player',round:1,busy:false,enemy:{...def,hp:def.hp,maxHp:def.hp,mp:def.mp||0,maxMp:def.mp||0,status:{poison:0,stun:0,guard:0,evade:0}},player:{guard:0,evade:0},log:[]};openModal('combatModal');$('#combatPlayerName').textContent=GAME.name;$('#combatEnemyName').textContent=def.name;buildCombatActions();combatLog(`遭遇 ${def.name}！`);resize();renderCombatHud();if(def.agi>derive().agi){COMBAT.turn='enemy';setTimeout(enemyTurn,450)}}
function buildCombatActions(){const box=$('#combatActions');box.innerHTML='';box.appendChild(btn('攻击',()=>playerAction('attack'),'primary'));box.appendChild(btn('武功',toggleSkillTray));box.appendChild(btn('防御',()=>playerAction('guard')));box.appendChild(btn('物品',openCombatItems));box.appendChild(btn('逃跑',()=>playerAction('escape')));const tray=$('#skillTray');tray.innerHTML='';GAME.activeSkills.filter(id=>GAME.skills[id]).forEach(id=>{let s=SKILLS[id];const b=btn(`${s.name}　${GAME.skills[id]}级`+`　${s.mp}内力`,()=>{tray.classList.remove('show');playerAction('skill',id)});tray.appendChild(b)})}
function toggleSkillTray(){if(COMBAT?.busy)return;$('#skillTray').classList.toggle('show')}
function openCombatItems(){if(COMBAT?.busy)return;const tray=$('#skillTray');tray.innerHTML='';let ids=Object.keys(GAME.inventory).filter(id=>['medicine','food','throw'].includes(ITEMS[id]?.type));if(!ids.length)tray.innerHTML='<div class="muted">没有可用物品</div>';ids.forEach(id=>tray.appendChild(btn(`${ITEMS[id].name} ×${GAME.inventory[id]}`,()=>{tray.classList.remove('show');playerAction('item',id)})));tray.classList.add('show')}
function playerAction(type,arg){if(!COMBAT||COMBAT.busy||COMBAT.turn!=='player')return;COMBAT.busy=true;if(type==='escape'){let rate=.25+derive().agi/(derive().agi+COMBAT.enemy.agi)*.45;if(Math.random()<rate){combatLog('你抓住空隙脱离了战斗。');setTimeout(endCombatEscape,500);return}else combatLog('逃跑失败！')}else if(type==='guard'){COMBAT.player.guard=.55;GAME.mp=Math.min(GAME.maxMp,GAME.mp+3);combatLog('你沉住气势，摆出守势。');combatFx('guard',true)}else if(type==='item'){const it=ITEMS[arg];if(it.type==='throw'){removeItem(arg,1);let dmg=it.damage+Math.floor(GAME.agi*.6);COMBAT.enemy.hp=Math.max(0,COMBAT.enemy.hp-dmg);combatLog(`你掷出${it.name}，造成 ${dmg} 点伤害。`);combatFx('hit',false)}else{useItem(arg,true);combatLog(`你使用了 ${it.name}。`);combatFx('heal',true)}}else if(type==='skill')useCombatSkill(arg);else basicAttack(true);renderCombatHud();if(COMBAT.enemy.hp<=0){setTimeout(victory,500);return}setTimeout(()=>{if(!COMBAT)return;COMBAT.turn='enemy';COMBAT.busy=false;enemyTurn()},520)}
function basicAttack(playerSide){const atk=derive().atk,def=COMBAT.enemy.def,acc=clamp(.82+(derive().agi-COMBAT.enemy.agi)*.012,.55,.96);if(Math.random()>acc){combatLog('你的攻击被对手闪开。');combatFx('miss',false);return}let crit=Math.random()<.05+derive().luck*.004,dmg=Math.max(1,Math.floor(atk*(.9+Math.random()*.25)-def*.55));if(crit)dmg=Math.floor(dmg*1.7);if(COMBAT.enemy.guard)dmg=Math.floor(dmg*(1-COMBAT.enemy.guard));COMBAT.enemy.hp=Math.max(0,COMBAT.enemy.hp-dmg);combatLog(`你一记${ITEMS[GAME.equipment.weapon]?.name||'拳掌'}攻去，造成 ${dmg}${crit?' 会心':''}伤害。`);combatFx(crit?'crit':'hit',false)}
function enemyTurn(){if(!COMBAT||COMBAT.enemy.hp<=0)return;COMBAT.busy=true;const e=COMBAT.enemy;if(e.status.poison>0){let pd=Math.max(3,Math.floor(e.maxHp*.025));e.hp=Math.max(0,e.hp-pd);e.status.poison--;combatLog(`${e.name}毒气攻心，损失 ${pd} 气血。`);combatFx('poison',false);if(e.hp<=0){setTimeout(victory,450);return}}if(e.status.stun>0){e.status.stun--;combatLog(`${e.name}气息一滞，本回合无法行动。`);setTimeout(nextPlayerTurn,420);return}let skills=e.skills||[];if(skills.length&&e.mp>12&&Math.random()<.48){let id=pick(skills),s=SKILLS[id];if(s&&e.mp>=s.mp){e.mp-=s.mp;enemySkill(id);renderCombatHud();if(GAME.hp<=0){setTimeout(defeat,500);return}setTimeout(nextPlayerTurn,600);return}}let evade=COMBAT.player.evade||0,acc=clamp(.82+(e.agi-derive().agi)*.01-evade,.38,.96);if(Math.random()>acc){combatLog(`${e.name}的攻击被你避开。`);combatFx('miss',true)}else{let dmg=Math.max(1,Math.floor(e.atk*(.86+Math.random()*.26)-derive().def*.5));if(COMBAT.player.guard)dmg=Math.floor(dmg*(1-COMBAT.player.guard));GAME.hp=Math.max(0,GAME.hp-dmg);combatLog(`${e.name}攻来，造成 ${dmg} 点伤害。`);combatFx('enemyhit',true)}renderCombatHud();if(GAME.hp<=0){setTimeout(defeat,500);return}setTimeout(nextPlayerTurn,500)}
function enemySkill(id){const s=SKILLS[id],e=COMBAT.enemy;if(s.heal){let h=Math.floor(e.maxHp*.12);e.hp=Math.min(e.maxHp,e.hp+h);e.guard=s.guard||0;combatLog(`${e.name}运转「${s.name}」，恢复 ${h} 气血。`);combatFx('heal',false);return}if(s.evadeBuff){e.evade=s.evadeBuff;combatLog(`${e.name}施展「${s.name}」。`);combatFx('wind',false);return}let acc=clamp((s.acc||.9)+(e.agi-derive().agi)*.008-(COMBAT.player.evade||0),.45,.98);if(Math.random()>acc){combatLog(`${e.name}的「${s.name}」落空。`);combatFx('miss',true);return}let dmg=Math.max(2,Math.floor(e.atk*s.power*(.88+Math.random()*.25)-derive().def*.46));if(COMBAT.player.guard)dmg=Math.floor(dmg*(1-COMBAT.player.guard));GAME.hp=Math.max(0,GAME.hp-dmg);if(s.poison&&Math.random()<s.poison)GAME.status.poison=Math.max(GAME.status.poison,3);combatLog(`${e.name}施展「${s.name}」，造成 ${dmg} 点伤害。`);combatFx('enemyhit',true)}
function nextPlayerTurn(){if(!COMBAT)return;COMBAT.round++;COMBAT.turn='player';COMBAT.busy=false;COMBAT.player.guard=0;COMBAT.player.evade=0;COMBAT.enemy.guard=0;COMBAT.enemy.evade=0;if(GAME.status.poison>0){let d=Math.max(2,Math.floor(GAME.maxHp*.018));GAME.hp=Math.max(0,GAME.hp-d);GAME.status.poison=Math.max(0,GAME.status.poison-1);combatLog(`毒伤发作，你损失 ${d} 气血。`);if(GAME.hp<=0){defeat();return}}renderCombatHud()}

function combatFx(type,targetPlayer){if(!GAME.settings.combatFx)return;const r=combatCanvas.getBoundingClientRect(),x=targetPlayer?r.width*.28:r.width*.72,y=r.height*.52,color=type.includes('heal')?'#8ed28b':type.includes('wind')?'#9fcad2':type.includes('poison')?'#7aae5a':type.includes('crit')?'#f1c96a':'#e6dfc8';for(let i=0;i<32;i++){let a=Math.random()*TAU,s=40+Math.random()*180;RUNTIME.combatParticles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.55,max:.95,size:2+Math.random()*5,color,type})}}

/* ===== 仙侠水墨版：NPC 归属修正（变体 region 与地图名统一，杜绝跨图台词窜位） ===== */
/* 变体桶名与地图名不一致的别名表：少室山/太和山/华岳/破庙总舵 → 地图名 */
function INK_regionOfScene(scene){
 const alias={shaolin:'少室山',wudang:'太和山',huashan:'华岳',beggar:'破庙总舵'};
 if(alias[scene])return alias[scene];
 const m=MAP_DEFS[scene];
 return m?m.name:'';
}
/* 选角链：title+region → title → region+kind → kind → null（由调用方兜底）；下标沿用蓝本 i%len；
   kind/region+kind 池只取桶变体（排除 X_NPCS 追加变体），防止任务/敌手变体借 kind 池漏到别图；
   带专属名号却查无此号（水贼/小偷/四大护卫等）→ 返回 null，由调用方以名号作姓名合成 */
const INK_VPOOL={};
function INK_vpool(key,fn){if(!INK_VPOOL[key])INK_VPOOL[key]=fn();return INK_VPOOL[key]}
function INK_pickVariant(scene,kind,wantedTitle,i){
 const reg=INK_regionOfScene(scene);
 const isBucket=n=>String(n.id||'').indexOf('x_')!==0;
 let pool=[];
 if(wantedTitle){
  pool=INK_vpool('t|'+reg+'|'+wantedTitle,()=>CONTENT.npcVariants.filter(n=>n.title===wantedTitle&&n.region===reg));
  if(!pool.length)pool=INK_vpool('t|'+wantedTitle,()=>CONTENT.npcVariants.filter(n=>n.title===wantedTitle));
  if(!pool.length)return null;
  if(pool.length>1){const kt=pool.filter(n=>n.kind===kind);if(kt.length)pool=kt}
 }
 if(!pool.length)pool=INK_vpool('bk|'+reg+'|'+kind,()=>CONTENT.npcVariants.filter(n=>isBucket(n)&&n.region===reg&&n.kind===kind));
 if(!pool.length)pool=INK_vpool('bk|'+kind,()=>CONTENT.npcVariants.filter(n=>isBucket(n)&&n.kind===kind));
 if(!pool.length)return null;
 return pool[i%pool.length];
}
/* 台词归属修正：同图（含别名桶）仅换地名；跨图兜底变体整句替换首行并改写其余行地名 */
function INK_fixDialogue(v,m,scene){
 if(!v)return ['这里是'+m.name+'。','江湖路远。'];
 const reg=v.region||'';
 const lines=(v.dialogue&&v.dialogue.length)?v.dialogue:['江湖路远。'];
 if(!reg||reg===m.name)return lines;
 if(reg===INK_regionOfScene(scene))return lines.map(s=>String(s).split(reg).join(m.name));
 return ['这里是'+m.name+'。'].concat(lines.slice(1).map(s=>String(s).split(reg).join(m.name)));
}
/* 任务绑定守卫：只有 NPC 位于该支线设计发布场景时才挂 questId，

   按名号推断任务只对 sidequest 组生效（押镖/摆渡等玩法NPC与任务发布人同号时不误挂） */
function INK_questFor(scene,title,kind,v){
 let qid=(v&&v.questId)||null;
 if(!qid&&kind==='sidequest')qid=X_QUEST_BY_GIVER[title]||null;
 if(qid&&INK_GIVER_SCENE[qid]&&INK_GIVER_SCENE[qid]!==scene)qid=null;
 return qid;
}
function INK_npcQuest(n){return n.questId||INK_questFor(GAME.scene,n.title,n.kind,null)}

/* 重名去重：同图同名者（如三个「吴守」山贼喽啰）以名号（分类名）作名，
   分类名可以重复、人名不得重复；室内外同图同规则 */
function INK_dupNamesForMap(m,scene){
 const counts={};
 m.groups.forEach((g,i)=>{
  const kind=g[0],wantedTitle=g[3];
  const v=INK_pickVariant(scene,kind,wantedTitle,i);
  const title=wantedTitle||(v&&v.title)||kind;
  const name=(v&&v.name)||title;
  counts[name]=(counts[name]||0)+1;

function INK_displayName(m,scene,title,v){

function INK_safePlace(x,y,dest){
 const r=15;
 const blocked=(nx,ny)=>nx<r||ny<r||nx>dest.w-r||ny>dest.h-r||dest.buildings.some(bb=>circleRect(nx,ny,r,{x:bb[1],y:bb[2],w:bb[3],h:bb[4]}))||dest.links.some(pp=>nx>pp[1]&&nx<pp[1]+pp[3]&&ny>pp[2]&&ny<pp[2]+pp[4]);
 if(!blocked(x,y))return [x,y];
 for(let rad=30;rad<=420;rad+=24)for(let a=0;a<TAU;a+=TAU/16){const nx=x+Math.cos(a)*rad,ny=y+Math.sin(a)*rad;if(!blocked(nx,ny))return [nx,ny]}
 return [x,y];
}
checkPortals=function(){

   const dest=MAP_DEFS[p.to];
   if(!dest)continue;
   const from=GAME.scene,to=p.to;
   GAME.scene=to;
   if(dest.type==='interior'){GAME.x=dest.spawn.x;GAME.y=dest.spawn.y}
   else{
    const back=dest.links.find(l=>l[0]===from);
    if(back){
     GAME.x=back[1]+back[3]/2;GAME.y=back[2]+back[4]/2;
     if(INK_isInterior(from)){GAME.y=back[2]+back[4]+22}
     else{
      if(back[3]<back[4])GAME.x+=back[1]<dest.w/2?90:-90;else GAME.y+=back[2]<dest.h/2?90:-90;
      const sp=INK_safePlace(GAME.x,GAME.y,dest);
      GAME.x=sp[0];GAME.y=sp[1];
     }

   }

findNearest=function(){
 let best=null,bd=78;
 for(const n of RUNTIME.npcs){if(!n.alive)continue;let d=Math.hypot(GAME.x-n.x,GAME.y-n.y);if(d<bd){bd=d;best={type:'npc',obj:n}}}
 for(const g of RUNTIME.gathers){let d=Math.hypot(GAME.x-g.x,GAME.y-g.y);if(d<bd){bd=d;best={type:'gather',obj:g}}}
 for(const o of RUNTIME.objects){
  if(o.kind==='deco'&&o.deco==='cushion'){let d=Math.hypot(GAME.x-(o.x+o.w/2),GAME.y-(o.y+o.h/2));if(d<64&&d<bd){bd=d;best={type:'cushion',obj:o}}}
 }
 /* NPC/采集点在交互半径内时建筑一律不参与竞争：仅当周围没有 NPC/采集/蒲团目标时才可选建筑 */
 if(!best){
  let bbd=78;
  for(const o of RUNTIME.objects){
   if(o.kind!=='building')continue;
   let nx=clamp(GAME.x,o.x,o.x+o.w),ny=clamp(GAME.y,o.y,o.y+o.h);
   let d=Math.hypot(GAME.x-nx,GAME.y-ny);
   if(d<bbd){bbd=d;best={type:'building',obj:o}}
  }
 }
 RUNTIME.nearest=best;
 const tip=$('#interactTip');
 if(best){
  let label=best.type==='npc'?(best.obj.name+' · '+best.obj.title):best.type==='gather'?('采集 '+ITEMS[best.obj.item].name):best.type==='cushion'?'在蒲团上打坐':('进入 '+best.obj.name);
  tip.textContent='E / 交互：'+label;tip.classList.add('show');
 }else tip.classList.remove('show');
};

};

 };

/* ===== 仙侠水墨版：中式建筑绘制（白墙青瓦 / 红柱殿宇 / 牌坊门楼 / 凉亭） ===== */
/* 建筑配色：墙体/屋顶各多色组合，按名称+序号确定性选取，同档读档不变 */
const INK_HOUSE_WALL=['#ece4cd','#e0d3ad','#cfd6c0','#d9c6a2'];
const INK_HOUSE_ROOF=['#3b3e3a','#43564e','#4a4038','#3e4a56'];
const INK_HALL_WALL=['#6d4a30','#5f4230','#7a5238','#63412e'];
function INK_light(hex,f){if(!hex||hex[0]!=='#')return hex;const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;const m=c=>Math.floor(c+(255-c)*(f||.25));return 'rgb('+m(r)+','+m(g)+','+m(b)+')'}
function INK_rgba(hex,a){if(!hex||hex[0]!=='#')return hex;const n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'}
function INK_esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
function INK_buildPalette(o){
 const s=String(o.name||''),idx=parseInt(String(o.id||'0').slice(1),10)||0;
 let h=0;
 for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i)+idx*131)%999983;
 return{
  wall:INK_HOUSE_WALL[Math.floor(seeded(h)*INK_HOUSE_WALL.length)%INK_HOUSE_WALL.length],
  roof:INK_HOUSE_ROOF[Math.floor(seeded(h+7)*INK_HOUSE_ROOF.length)%INK_HOUSE_ROOF.length],
  wallHall:INK_HALL_WALL[Math.floor(seeded(h+13)*INK_HALL_WALL.length)%INK_HALL_WALL.length]
 };
}
function INK_roof(g,x,y,w,h,color){
 color=color||'#3b3e3a';
 const rl=x+w*.13,rr=x+w*.87,ridgeY=y-h;
 g.fillStyle=color;
 g.beginPath();
 g.moveTo(x,y+3);
 g.quadraticCurveTo(x+w*.24,y-h*.18,rl,ridgeY+2);
 g.lineTo(rr,ridgeY+2);
 g.quadraticCurveTo(x+w*.76,y-h*.18,x+w,y+3);
 g.lineTo(x+w*.93,y+7);
 g.lineTo(x+w*.07,y+7);
 g.closePath();g.fill();
 g.strokeStyle='rgba(18,24,20,.55)';g.lineWidth=1.5;g.stroke();
 g.strokeStyle='rgba(236,230,206,.16)';g.lineWidth=1;
 for(let k=1;k<=3;k++){
  const t=k/4;
  g.beginPath();
  g.moveTo(x+(rl-x)*t,y+4-(y+4-ridgeY)*t);
  g.lineTo(x+w-(x+w-rr)*t,y+4-(y+4-ridgeY)*t);
  g.stroke();
 }
 g.fillStyle=INK_light(color,.22);
 g.fillRect(rl-7,ridgeY-4,rr-rl+14,8);
 g.fillStyle=INK_light(color,.3);g.fillRect(rl-7,ridgeY-4,rr-rl+14,3);
 g.fillStyle=INK_light(color,.22);
 g.beginPath();g.moveTo(rl-7,ridgeY-4);g.quadraticCurveTo(rl-15,ridgeY-9,rl-20,ridgeY-16);g.lineTo(rl-13,ridgeY-5);g.closePath();g.fill();
 g.beginPath();g.moveTo(rr+7,ridgeY-4);g.quadraticCurveTo(rr+15,ridgeY-9,rr+20,ridgeY-16);g.lineTo(rr+13,ridgeY-5);g.closePath();g.fill();
 g.strokeStyle='rgba(24,28,24,.8)';g.lineWidth=2;
 g.beginPath();g.moveTo(x+w*.07,y+7);g.lineTo(x+w*.93,y+7);g.stroke();
}
function INK_plaque(g,cx,cy,w,name){
 const ph=19;
 g.font='bold 12px "KaiTi","STKaiti","FangSong",serif';
 const pw=Math.max(w,g.measureText(name).width+18);

function INK_dark(hex){if(!hex||hex[0]!=='#')return hex;const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;return 'rgb('+Math.floor(r*.55)+','+Math.floor(g*.55)+','+Math.floor(b*.55)+')'}
function INK_ridge(g,w,h,baseY,amp,color){g.save();g.fillStyle=color;g.beginPath();g.moveTo(0,h);const n=8;for(let i=0;i<=n;i++){const x=w*i/n,y=baseY+Math.sin(i*2.3)*amp+((i*53)%5)*amp*.5;g.lineTo(x,y)}g.lineTo(w,h);g.closePath();g.fill();g.restore()}

/* ===== 仙侠水墨版：渲染主循环（小地图居中显示） ===== */
function render(){
 const w=RUNTIME.screen.w,h=RUNTIME.screen.h;
 ctx.clearRect(0,0,w,h);
 if(!GAME||!GAME.started){drawTitleBackdrop(ctx,w,h);return}
 const m=MAP_DEFS[GAME.scene];
 let cx,cy;
 if(m.w<=w)cx=m.w/2;else cx=clamp(RUNTIME.camera.x,w/2,m.w-w/2);
 if(m.h<=h)cy=m.h/2;else cy=clamp(RUNTIME.camera.y,h/2,m.h-h/2);
 const ox=w/2-cx,oy=h/2-cy;
 const INK_drk=GAME.status.drunk||0;
 let INK_shX=0,INK_shY=0;
 if(INK_drk>40){const amp=Math.min(3.5,(INK_drk-40)*.05);INK_shX=Math.sin(now()*.011)*amp;INK_shY=Math.cos(now()*.009)*amp}
 ctx.save();ctx.translate(ox+INK_shX,oy+INK_shY);
 drawGround(m,cx,cy,w,h);drawRoads(m);
 for(const o of RUNTIME.objects)drawObject(o);
 for(const p of RUNTIME.portals)drawPortal(p);
 for(const g of RUNTIME.gathers)drawGather(g);
 INK_drawDazuoAura();
 const actors=RUNTIME.npcs.filter(n=>n.alive).map(n=>({type:'npc',y:n.y,obj:n}));
 actors.push({type:'player',y:GAME.y,obj:GAME});
 actors.sort((a,b)=>a.y-b.y);
 for(const a of actors)a.type==='player'?drawPlayer(GAME):drawNpc(a.obj);
 INK_drawTrackArrow();
 INK_drawDazuoRing();
 for(const p of RUNTIME.particles)drawParticle(ctx,p);
 ctx.restore();
 drawWeather(w,h);drawDayOverlay(w,h,m);
 INK_drawMinimap();
}

 let mg=g.createRadialGradient(mx,my,6,mx,my,220);
 mg.addColorStop(0,'rgba(238,232,208,.85)');mg.addColorStop(.2,'rgba(215,205,170,.25)');mg.addColorStop(1,'rgba(215,205,170,0)');
 g.fillStyle=mg;g.fillRect(0,0,w,h);
 for(let i=0;i<50;i++){const x=(i*97)%w,y=(i*53)%(h*.4);g.globalAlpha=.08+(i%5)*.03;g.fillStyle='rgba(236,231,210,.9)';g.beginPath();g.arc(x,y,1+(i%3)*.5,0,TAU);g.fill()}
 g.globalAlpha=1;
 INK_ridge(g,w,h,h*.62,h*.09,'rgba(58,84,72,.3)');

 for(let i=0;i<4;i++){const x=((now()*.01+i*280)%(w+500))-250,y=h*(.55+i*.09);
  let grd=g.createLinearGradient(x-240,0,x+240,0);
  grd.addColorStop(0,'rgba(216,224,208,0)');grd.addColorStop(.5,'rgba(216,224,208,.1)');grd.addColorStop(1,'rgba(216,224,208,0)');
  g.fillStyle=grd;g.beginPath();g.ellipse(x,y,240,42,0,0,TAU);g.fill()}
 INK_crane(g,w*.2,h*.24,1);INK_crane(g,w*.78,h*.3,.62);
}

 const g=ctx;
 g.fillStyle=m.ground;g.fillRect(0,0,m.w,m.h);
 g.strokeStyle='rgba(35,24,14,.22)';g.lineWidth=1;
 for(let yy=0;yy<m.h;yy+=34){g.beginPath();g.moveTo(0,yy);g.lineTo(m.w,yy);g.stroke()}

 g.fillStyle=rg;g.fillRect(m.w*.94,m.h*.16,m.w*.06,m.h*.84);

function drawGround(m,cx,cy,w,h){
 if(m.type==='interior'){INK_floor(m,cx,cy,w,h);return}
 const g=ctx;
 g.fillStyle=m.ground;g.fillRect(0,0,m.w,m.h);
 g.fillStyle='rgba(13,30,24,.16)';g.fillRect(0,0,m.w,m.h);
 const step=110;
 g.strokeStyle='rgba(30,48,38,.10)';g.lineWidth=1;
 let sx=Math.floor((cx-w/2)/step)*step,sy=Math.floor((cy-h/2)/step)*step;
 for(let x=sx;x<cx+w/2+step;x+=step){g.beginPath();g.moveTo(x,sy);g.lineTo(x,cy+h/2+step);g.stroke()}
 for(let y=sy;y<cy+h/2+step;y+=step){g.beginPath();g.moveTo(sx,y);g.lineTo(cx+w/2+step,y);g.stroke()}
 for(let i=0;i<40;i++){const x=seeded(i*29+3)*m.w,y=seeded(i*23+9)*m.h;if(x<cx-w/2-190||x>cx+w/2+190||y<cy-h/2-190||y>cy+h/2+190)continue;
  const r=70+seeded(i*7)*150;
  const grd=g.createRadialGradient(x,y,0,x,y,r);
  grd.addColorStop(0,'rgba(8,20,17,.13)');grd.addColorStop(1,'rgba(8,20,17,0)');
  g.fillStyle=grd;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
 for(let i=0;i<130;i++){const x=seeded(i*31+11)*m.w,y=seeded(i*17+13)*m.h;if(x<cx-w/2-30||x>cx+w/2+30||y<cy-h/2-30||y>cy+h/2+30)continue;
  g.strokeStyle=i%4===0?'rgba(226,214,178,.14)':'rgba(20,38,30,.16)';g.lineWidth=1;
  g.beginPath();g.moveTo(x,y+6);g.lineTo(x+(i%3-1)*2,y-4);g.stroke()}
}

 const it=g.item;
 if(it==='ore'){ctx.strokeStyle='#8fb0c0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(gx-6,gy+5);ctx.lineTo(gx,gy-8);ctx.lineTo(gx+6,gy+5);ctx.closePath();ctx.stroke();ctx.strokeStyle='rgba(200,230,240,.6)';ctx.beginPath();ctx.moveTo(gx,gy-8);ctx.lineTo(gx,gy+5);ctx.stroke()}
 else if(it==='wood'){ctx.strokeStyle='#7a5c3a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(gx-7,gy+4);ctx.lineTo(gx+7,gy-4);ctx.stroke();ctx.strokeStyle='rgba(220,200,160,.7)';ctx.beginPath();ctx.arc(gx,gy+1,7,Math.PI*.25,Math.PI*1.15);ctx.stroke()}
 else if(it==='hide'||it==='fish'){ctx.fillStyle=it==='hide'?'#a8845c':'#9fb8c8';ctx.beginPath();ctx.ellipse(gx,gy,9,6,0,0,TAU);ctx.fill();if(it==='fish'){ctx.fillStyle='#38505f';ctx.beginPath();ctx.moveTo(gx+9,gy);ctx.lineTo(gx+15,gy-5);ctx.lineTo(gx+15,gy+5);ctx.closePath();ctx.fill()}}

 else if(it==='ginseng'){ctx.strokeStyle='#c9b48a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(gx,gy+6);ctx.quadraticCurveTo(gx+3,gy-2,gx-4,gy-7);ctx.stroke();ctx.beginPath();ctx.moveTo(gx-1,gy+1);ctx.lineTo(gx-8,gy-4);ctx.moveTo(gx-1,gy);ctx.lineTo(gx+7,gy-4);ctx.stroke();ctx.fillStyle='#7fae7c';ctx.beginPath();ctx.arc(gx-4,gy-9,3,0,TAU);ctx.fill()}
 else if(it==='venom'||it==='peach_mark'){ctx.fillStyle=it==='venom'?'#8aa06c':'#d88f95';ctx.beginPath();ctx.arc(gx,gy-1,4,0,TAU);ctx.fill();if(it==='peach_mark'){ctx.strokeStyle='rgba(214,120,130,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(gx-5,gy-1);ctx.lineTo(gx+5,gy-1);ctx.moveTo(gx,gy-6);ctx.lineTo(gx,gy+4);ctx.stroke()}}
 else{ctx.strokeStyle='#6fae7c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(gx,gy+5);ctx.quadraticCurveTo(gx,gy-4,gx,gy-8);ctx.stroke();ctx.fillStyle='#8fc79a';ctx.beginPath();ctx.ellipse(gx-4,gy-4,4,2,-.6,0,TAU);ctx.ellipse(gx+4,gy-7,4,2,.6,0,TAU);ctx.fill()}

function drawPlayer(p){

function INK_mapCurrentScene(){
 if(INK_isInterior(GAME.scene)){const p=INK_parseInterior(GAME.scene);if(p)return p.outer}
 return GAME.scene;
}
function INK_mapTargetScene(){
 const t=INK_trackTarget();
 if(!t)return null;
 if(INK_isInterior(t.scene)){const p=INK_parseInterior(t.scene);return p?p.outer:null}
 return t.scene;
}
function INK_mapSceneAt(x,y,w,h){
 let best=null,bd=24*24;
 for(const id in WORLD_POS){
  const pos=WORLD_POS[id];
  const dx=pos[0]/100*w-x,dy=pos[1]/100*h-y,dd=dx*dx+dy*dy;
  if(dd<bd){bd=dd;best=id}
 }
 return best;
}

function INK_route(from,to){
 if(from===to)return [from];
 const prev={};prev[from]=null;
 const queue=[from];
 while(queue.length){
  const c=queue.shift();
  const m=MAP_DEFS[c];
  if(!m||!m.links)continue;
  for(const l of m.links){
   const n=l[0];
   if(prev[n]!==undefined)continue;
   prev[n]=c;
   if(n===to){
    const path=[to];
    let cur=to;
    while(cur!==from){cur=prev[cur];if(cur===undefined)return null;path.unshift(cur)}
    return path;
   }
   queue.push(n);
  }
 }
 return null;
}
function INK_routeNext(from,to){
 const path=INK_route(from,to);
 return path&&path.length>1?path[1]:null;
}
function INK_factionMaps(){

 g.save();
 g.translate(GAME.x+c*rim,GAME.y+s*rim);

 g.scale(pulse*lenF,pulse*thkF);
 g.fillStyle='rgba(233,201,106,.8)';

function INK_dazuoSpot(){
 const sc=GAME.scene;
 let key='town';
 if(INK_isInterior(sc))key='interior';
 else if(INK_DAZUO_WILD[sc])key='wild';
 else if(sc==='city'||sc==='village')key='town';
 else{
  let faction=false;
  for(const k in FACTIONS){if(k!=='none'&&FACTIONS[k].map===sc){faction=true;break}}
  key=faction?'faction':'town';
 }
 const s=INK_DAZUO_SPOTS[key];
 const night=INK_isNight()?1.2:1;
 return Object.assign({key:key},s,{lingqi:Math.round(s.lingqi*night*100)/100});
}
function INK_dazuoMethodList(){
 const out=[];
 for(const id in INK_DAZUO_METHODS){
  const m=INK_DAZUO_METHODS[id];
  const ng=GAME.neigong||{level:1};
  if(m.skill&&!(GAME.skills&&GAME.skills[m.skill]))continue;
  if((ng.level||1)<(m.req||0))continue;
  out.push({id:id,name:m.name,grade:m.grade,desc:m.desc,theme:m.theme});
 }
 return out;
}
function INK_dazuoMethod(id){
 const m=INK_DAZUO_METHODS[id];
 if(!m)return null;
 if(m.skill&&!(GAME.skills&&GAME.skills[m.skill]))return null;
 const ng=GAME.neigong||{level:1};
 if((ng.level||1)<(m.req||0))return null;
 return m;
}
function INK_dazuoBlock2(){
 if(!GAME||!GAME.started)return {block:'尚未开始游戏'};
 if(COMBAT)return {block:'战斗之中无法打坐'};
 const st=GAME.status||{};
 const warns=[];
 const spot=INK_dazuoSpot();
 if(spot.danger)warns.push('此地不甚安全，打坐时仍需留心');
 if(st.drunk>0)return {block:'酒意未散，不宜运功'};
 if(st.hunger>65)return {block:'饥肠辘辘，难以凝神'};
 if((st.chaos||0)>=80)return {block:'内息紊乱，经脉不畅，无法入定'};
 const satiety=100-(st.hunger||0);
 if(satiety<=20)warns.push('腹中饥饿，恐难久守心神');
 if((st.fatigue||0)>=70)warns.push('身心俱疲，难以入定');
 if((st.injury||0)>0)warns.push('你身上有伤，强行运功恐有不妥');
 if((st.poison||0)>0)warns.push('毒气未清，内息运转略有滞涩');
 const ng=GAME.neigong||{};
 if(ng.bottleneck)warns.push('内力已至瓶颈，继续打坐无法提升上限');
 return {warns:warns};
}
function INK_neigongExpNeed(level){return Math.floor(40*Math.pow(level,1.6))}
function INK_neigongCapLimit(){const ng=GAME.neigong||{level:1};return 20+ng.level*15}
function INK_neigongGain(exp){
 const ng=GAME.neigong;
 ng.exp+=exp;
 const need=INK_neigongExpNeed(ng.level);
 if(ng.exp>=need){
  ng.exp-=need;ng.level++;GAME.maxMp+=2;ng.bottleneck=false;
  toast('内功修为精进，臻至 第'+ng.level+'层，内力上限+2','good');
  INK_dazuoEvent((GAME.meditation&&GAME.meditation.session)||null,'levelup',{level:ng.level});
 }
 RUNTIME.dirtyHud=true;
}
function INK_dazuoEvent(s,type,data){
 if(!s)return;
 if(!s.events)s.events=[];
 s.events.push({type:type,at:Date.now(),data:data||null});
 if(s.events.length>60)s.events=s.events.slice(-60);
}
function INK_dazuoStabInit(spot,m){
 const st=GAME.status;
 let v=55+spot.comfort*30+m.stab+GAME.root*.3;
 if((st.fatigue||0)>50)v-=10;
 if((st.injury||0)>0)v-=8;
 if((st.poison||0)>0)v-=8;
 if((st.chaos||0)>0)v-=12;
 return clamp(v,5,95);
}
function INK_dazuoEff(s,m,spot){
 const st=GAME.status;
 const satiety=100-(st.hunger||0);
 const satMul=satiety<=0?.5:satiety<=20?.7:satiety<=50?.85:1;
 const fat=st.fatigue||0;
 const fatMul=fat<50?1:fat<70?.9:fat<90?.75:.6;
 const inj=st.injury||0;
 const injMul=inj<=0?1:Math.max(.5,1-inj/GAME.maxHp*.8);
 const poisMul=(st.poison||0)>0?.8:1;
 const chaosMul=(st.chaos||0)>0?.7:1;
 const attr=1+(GAME.root-10)*.008+(GAME.insight-10)*.004;
 const ph=INK_DAZUO_CFG.phaseMult[s.stage]||1;
 let eff=1*m.recover*spot.lingqi*attr*satMul*fatMul*injMul*poisMul*chaosMul*ph;
 const cfg=INK_DAZUO_CFG;
 if(cfg.decay.on&&s.tickCount>cfg.decay.startTick){
  eff*=Math.max(cfg.decay.floor,1-(s.tickCount-cfg.decay.startTick)*cfg.decay.perTick);
 }
 return clamp(eff,cfg.effMin,cfg.effMax);
}
function INK_dazuoStart(methodId,gameSec){

 const mid=methodId||RUNTIME.dzMethod||'static';
 const m=INK_dazuoMethod(mid);
 if(!m){toast('此心法不可用','warn');return false}
 RUNTIME.dzMethod=m.skill?mid:'static';
 const spot=INK_dazuoSpot();
 const st=GAME.status;
 const s={
  id:'dz'+Date.now().toString(36)+Math.floor(Math.random()*1e4),
  scene:GAME.scene,spotKey:spot.key,methodId:RUNTIME.dzMethod,methodName:m.name,
  state:'tiaoxi',stage:'tiaoxi',elapsed:0,target:clamp(gameSec||1800,INK_DAZUO_CFG.minSec,INK_DAZUO_CFG.maxSec),
  acc:0,stab:INK_dazuoStabInit(spot,m),zhoutianAcc:0,zhoutianCount:0,shougongLeft:INK_DAZUO_CFG.shougongRealSec,
  hp0:GAME.hp,mp0:GAME.mp,sta0:GAME.sta,inj0:st.injury||0,pois0:st.poison||0,
  totals:{hp:0,mp:0,sta:0,exp:0,cap:0,injury:0,poison:0},
  tickCount:0,logAcc:{hp:0,mp:0,exp:0},logs:['你盘膝而坐，缓缓调息。'],events:[],healBase:(1.5+GAME.root*.2)/3600
 };
 md.session=s;md.active=true;
 INK_dazuoEvent(s,'start');
 openModal('meditateModal');
 INK_renderMeditateLive();
 saveSlot(0,true);
 return true;
}
function INK_dazuoRequestEnd(){
 const md=GAME.meditation;
 if(!md.active||!md.session)return false;
 const s=md.session;
 if(s.state==='shougong')return false;
 s.state='shougong';s.stage='shougong';s.shougongLeft=INK_DAZUO_CFG.shougongRealSec;s.acc=0;
 s.logs.push('你徐徐吐纳，准备收功。');
 INK_dazuoEvent(s,'shougong');
 INK_renderMeditateLive();
 return true;
}
function INK_dazuoEnd(interrupted,reason){
 const md=GAME.meditation;
 if(!md.active||!md.session)return;
 const s=md.session;
 md.active=false;
 s.state=interrupted?'interrupted':'ended';
 if(interrupted){
  if(s.stage==='shougong'){
   GAME.status.chaos=Math.min(100,(GAME.status.chaos||0)+10);
   GAME.mp=Math.max(0,GAME.mp-Math.round(GAME.maxMp*.03));
   toast('收功被打断：内息微乱，内力略有损耗','warn');
  }else{
   if(reason==='zouhuo'){
    GAME.status.chaos=Math.min(100,(GAME.status.chaos||0)+25);
    GAME.mp=Math.max(0,GAME.mp-Math.round(GAME.maxMp*.1));
    GAME.hp=Math.max(1,GAME.hp-Math.round(INK_effMaxHp()*.05));
    toast('走火入魔！内息大乱，真气逆行','bad');
    burstPlayer('#8a4a5a',30);
   }else if(reason==='ambush'){
    toast('入定之际被人打断，遭遇敌袭！','warn');
    burstPlayer('#c8c0a8',26);
   }else{
    toast('气息微乱，你不敢继续入定。','warn');
    s.stab=Math.max(0,s.stab-10);
   }
   GAME.status.fatigue=Math.min(100,(GAME.status.fatigue||0)+2);
  }
  s.logs.push(reason==='zouhuo'?'气息逆冲，走火入魔！':(reason==='ambush'?'外敌来袭，你被迫中断修炼。':'忽闻异声，你倏然收功睁眼。'));
 }else{
  if(s.elapsed>=INK_DAZUO_CFG.minSec){
   INK_neigongGain(INK_DAZUO_CFG.shougongExp);
   s.totals.exp+=INK_DAZUO_CFG.shougongExp;
   s.stab=Math.min(100,s.stab+3);
  }
  s.logs.push('你缓缓吐出一口浊气，收功而起。');
  toast('打坐完毕，内息归元','good');
 }
 md.last={ended:!interrupted,totals:s.totals,zhoutian:s.zhoutianCount,elapsed:s.elapsed,reason:reason||''};
 INK_dazuoEvent(s,interrupted?'interrupt':'end',{reason:reason||''});
 INK_statusWarn();
 saveSlot(0,true);
 RUNTIME.dirtyHud=true;
 if(RUNTIME.dzFx&&interrupted)RUNTIME.dzFx.shatter=1;
 if(UI.modal==='meditateModal'&&reason!=='ambush')INK_renderMeditateResult(s,interrupted,reason);
}
function INK_dazuoSettleTick(s){
 if(!s||s.state==='shougong')return;
 const cfg=INK_DAZUO_CFG,st=GAME.status,ng=GAME.neigong;
 const spot=INK_dazuoSpot(),m=INK_dazuoMethod(s.methodId)||INK_DAZUO_METHODS['static'];
 s.elapsed+=cfg.tickSec;s.tickCount++;
 GAME.time.minute+=cfg.tickSec/60;
 while(GAME.time.minute>=1440){GAME.time.minute-=1440;GAME.time.day++}
 /* 1 打断判定（地点基础打断率 × 状态修正） */
 let p=spot.interrupt;
 if((st.chaos||0)>0)p*=2;
 if(s.stab<30)p*=2;
 if(m.risk>1)p*=1+(m.risk-1)*.5;
 if(p>0&&Math.random()<p){
  if(spot.danger){INK_dazuoEnd(true,'ambush');closeModal('meditateModal');startCombat(pick(['thief','bandit','wolf']));return}
  INK_dazuoEnd(true,'disturb');return;
 }
 /* 毒发扰心 */
 if((st.poison||0)>0&&Math.random()<.0004*st.poison){
  s.stab=Math.max(0,s.stab-8);
  s.logs.push('毒性上涌，气息微滞。');
  if(s.logs.length>6)s.logs.shift();
 }
 /* 走火入魔（可配置关闭） */
 if(cfg.zouhuo.on){
  let zr=cfg.zouhuo.basePerTick*m.risk;
  if(s.stab<30)zr*=8;
  if((st.fatigue||0)>80)zr*=3;
  if((st.poison||0)>0)zr*=2;
  if((st.chaos||0)>0)zr*=3;
  if(Math.random()<zr){INK_dazuoEnd(true,'zouhuo');return}
 }
 /* 2-3 阶段判定 */
 const prevStage=s.stage;
 if(s.elapsed<cfg.stageTiaoxi)s.stage='tiaoxi';
 else if(s.elapsed<cfg.stageDeep||s.stab<cfg.deepStabReq)s.stage='ruding';
 else s.stage='xingqi';
 if(s.stage!==prevStage){
  s.state=s.stage;
  if(s.stage==='ruding'){s.logs.push('呼吸渐缓，心神渐宁，你进入入定之境。');INK_dazuoEvent(s,'stage',{stage:'ruding'})}
  if(s.stage==='xingqi'){s.logs.push('真气渐盛，你开始运转周天行气。');INK_dazuoEvent(s,'stage',{stage:'xingqi'})}
  if(s.logs.length>6)s.logs.shift();
  RUNTIME.dirtyHud=true;
 }
 /* 6-8 效率 */
 const eff=INK_dazuoEff(s,m,spot);
 const ph=cfg.phaseMult[s.stage]||1;
 /* 9 资源恢复 */
 const eff0=INK_effMaxHp();
 const hp0=GAME.hp,mp0=GAME.mp,sta0=GAME.sta;
 GAME.hp=Math.min(eff0,GAME.hp+eff0*cfg.base.hpPerSec*cfg.tickSec*eff*m.hp*ph);
 GAME.mp=Math.min(GAME.maxMp,GAME.mp+GAME.maxMp*cfg.base.mpPerSec*cfg.tickSec*eff*m.mp*ph);
 GAME.sta=Math.min(GAME.maxSta,GAME.sta+GAME.maxSta*cfg.base.staPerSec*cfg.tickSec*eff*ph);
 s.totals.hp+=GAME.hp-hp0;s.totals.mp+=GAME.mp-mp0;s.totals.sta+=GAME.sta-sta0;
 s.logAcc.hp+=GAME.hp-hp0;s.logAcc.mp+=GAME.mp-mp0;
 /* 10 内功经验（单点入口） */
 const dExp=cfg.base.expPerSec*cfg.tickSec*eff*m.exp*ph;
 INK_neigongGain(dExp);s.totals.exp+=dExp;s.logAcc.exp+=dExp;
 /* 11 内力上限成长（瓶颈封顶） */
 if(!ng.bottleneck){
  s.capAcc=(s.capAcc||0)+cfg.base.capPerSec*cfg.tickSec*eff*m.cap*(s.stage==='xingqi'?1.3:1);
  if(s.capAcc>=1){
   if(ng.capBonus<INK_neigongCapLimit()){ng.capBonus++;s.capAcc-=1;GAME.maxMp++;s.totals.cap++;}
   else{ng.bottleneck=true;s.capAcc=0;s.logs.push('内力已至瓶颈，若无突破难有寸进。');INK_dazuoEvent(s,'bottleneck');toast('内力已至瓶颈','warn');if(s.logs.length>6)s.logs.shift()}
  }
 }
 /* 12 疗伤 */
 if((st.injury||0)>0){
  s.healAcc=(s.healAcc||0)+s.healBase*cfg.tickSec*eff*m.heal*ph;
  if(s.healAcc>=1){
   const apply=Math.min(st.injury,Math.floor(s.healAcc));
   st.injury-=apply;s.healAcc-=apply;s.totals.injury+=apply;
   GAME.hp=Math.min(INK_effMaxHp(),GAME.hp);
   if(apply>0){s.logs.push('内伤缓愈 '+apply+' 点。');if(s.logs.length>6)s.logs.shift()}
  }
 }
 /* 13 解毒（仅心法解毒倍率>0） */
 if((st.poison||0)>0&&m.detox>0){
  s.detoxAcc=(s.detoxAcc||0)+cfg.base.detoxPerSec*cfg.tickSec*m.detox*eff;
  if(s.detoxAcc>=1){const apply=Math.min(st.poison,Math.floor(s.detoxAcc));st.poison-=apply;s.detoxAcc-=apply;s.totals.poison+=apply}
 }
 /* 14-15 饱食消耗与消疲 */
 st.hunger=Math.min(100,(st.hunger||0)+cfg.hungerPerSec*cfg.tickSec);
 st.fatigue=Math.max(0,(st.fatigue||0)-cfg.fatiguePerSec*cfg.tickSec);
 /* 16 稳定度漂移 */
 const satiety=100-(st.hunger||0);
 let target=45+spot.comfort*30+m.stab+(satiety>50?4:0);
 if((st.fatigue||0)>50)target-=8;
 if((st.injury||0)>0)target-=8;
 if((st.poison||0)>0)target-=8;
 if((st.chaos||0)>0)target-=14;
 if(spot.danger)target-=10;
 s.stab=clamp(s.stab+(target-s.stab)*.02+(Math.random()-.5)*.6,0,100);
 /* 17 周天 */
 if(s.stage==='ruding'||s.stage==='xingqi'){
  s.zhoutianAcc+=cfg.tickSec;
  if(s.zhoutianAcc>=cfg.zhoutian.interval){
   s.zhoutianAcc=0;
   if(s.stab>=cfg.zhoutian.stabReq){
    s.zhoutianCount++;s.stab=Math.min(100,s.stab+cfg.zhoutian.stabBonus);
    const bonus=cfg.zhoutian.expBonus*m.exp;
    INK_neigongGain(bonus);s.totals.exp+=bonus;
    s.capAcc=(s.capAcc||0)+cfg.zhoutian.capBoost;
    s.logs.push('内息圆转一周，你感到内息精纯了几分。');
    INK_dazuoEvent(s,'zhoutian');
    if(RUNTIME.dzFx)RUNTIME.dzFx.ring=1;
   }else{
    s.zhoutianAcc=cfg.zhoutian.interval*.5;
    s.logs.push('内息微乱，周天未能运转。');
    INK_dazuoEvent(s,'zhoutian_fail');
   }
   if(s.logs.length>6)s.logs.shift();
  }
 }
 /* 19 日志聚合（不逐 tick 刷屏） */
 if(s.tickCount%cfg.logEvery===0&&(s.logAcc.hp>=1||s.logAcc.mp>=1||s.logAcc.exp>=.5)){
  s.logs.push('调息渐入佳境：气血+'+Math.round(s.logAcc.hp)+'，内力+'+Math.round(s.logAcc.mp)+'，内功经验+'+s.logAcc.exp.toFixed(1));
  s.logAcc={hp:0,mp:0,exp:0};
  if(s.logs.length>6)s.logs.shift();
 }
 /* 20 表现事件（逻辑层只发事件/粒子，不碰 UI 动画细节） */
 INK_dazuoFxEmit(s,m);
 /* 21 结束判断 */
 if(s.elapsed>=s.target){INK_dazuoRequestEnd();return}
 RUNTIME.dirtyHud=true;
}
function INK_dazuoTick(dt){
 const md=GAME&&GAME.meditation;
 if(!md||!md.active||!md.session)return;
 if(COMBAT)return;
 const s=md.session;
 if(s.state==='shougong'){
  s.shougongLeft-=(dt||0);
  if(s.shougongLeft<=0){INK_dazuoEnd(false);return}
  return;
 }
 s.acc+=(dt||0)*INK_DAZUO_CFG.gameSecPerRealSec;
 let guard=0;
 while(s.acc>=INK_DAZUO_CFG.tickSec&&md.active&&md.session===s&&guard++<240){
  s.acc-=INK_DAZUO_CFG.tickSec;
  INK_dazuoSettleTick(s);
 }
 if(UI.modal==='meditateModal'&&md.active&&s.tickCount%8===0)INK_renderMeditateLive();
}

}

 g.strokeStyle=theme;g.lineWidth=1.5;

}

function renderCombatHud(){if(!COMBAT)return;const eff=INK_effMaxHp(),drk=Math.floor(GAME.status.drunk||0),fat=Math.floor(GAME.status.fatigue||0);let stxt='';if(drk>0)stxt+=' · 醉 '+drk;if(fat>50)stxt+=' · 疲 '+fat;$('#combatPlayerHp').style.width=(GAME.hp/eff*100)+'%';$('#combatEnemyHp').style.width=(COMBAT.enemy.hp/COMBAT.enemy.maxHp*100)+'%';$('#combatPlayerText').textContent=`气血 ${Math.ceil(GAME.hp)}/${eff}${GAME.status.injury>0?` · 内伤 ${GAME.status.injury}`:''}${stxt} · 内力 ${Math.ceil(GAME.mp)}/${GAME.maxMp}`;$('#combatEnemyText').textContent=`气血 ${Math.ceil(COMBAT.enemy.hp)}/${COMBAT.enemy.maxHp} · 第 ${COMBAT.round} 回合`;RUNTIME.dirtyHud=true}
/* 状态页：显示内伤与受损上限，疲劳/醉酒仿内伤tag展示，可一键前往打坐 */
function renderStatus(body){const d=derive(),pct=Math.floor(GAME.exp/GAME.nextExp*100),inj=GAME.status.injury||0,eff=INK_effMaxHp(),fat=Math.floor(GAME.status.fatigue||0),drk=Math.floor(GAME.status.drunk||0);const ng=GAME.neigong||{exp:0,level:1,capBonus:0,bottleneck:false},chaos=GAME.status.chaos||0;body.innerHTML=`<div class="grid2"><div class="card"><h3>${INK_esc(GAME.name)} · ${titleByState()}</h3><div class="kv"><b>等级</b><span>${GAME.level}（经验 ${GAME.exp}/${GAME.nextExp}，${pct}%）</span><b>门派</b><span>${(FACTIONS[GAME.faction]||FACTIONS.none).name}</span><b>地点</b><span>${MAP_DEFS[GAME.scene].name}</span><b>银两</b><span>${formatMoney(GAME.money)}</span><b>名声 / 善恶</b><span>${GAME.fame} / ${GAME.morality}</span></div></div><div class="card"><h3>战斗属性</h3><div class="kv"><b>气血</b><span>${Math.ceil(GAME.hp)} / ${eff}${inj>0?` <span class="bad">内伤 ${inj}</span>`:''}</span><b>内力</b><span>${Math.ceil(GAME.mp)} / ${GAME.maxMp}${ng.capBonus>0?` <span class="ok">上限+${ng.capBonus}</span>`:''}</span><b>攻击</b><span>${d.atk}</span><b>防御</b><span>${d.def}</span><b>身法</b><span>${d.agi}${fat>80||drk>40?` <span class="bad">（疲惫/酒意折损）</span>`:''}</span><b>悟性 / 根骨</b><span>${GAME.insight} / ${GAME.root}</span><b>福缘</b><span>${d.luck}</span></div></div></div><div class="card" style="margin-top:10px"><h3>状态与旅程</h3><span class="tag">饥饿 ${Math.floor(GAME.status.hunger)}</span><span class="tag">中毒 ${GAME.status.poison}</span>${inj>0?`<span class="tag" style="border-color:#a0453b;color:#a0453b">内伤 ${inj}</span>`:''}${fat>0?`<span class="tag" style="border-color:#5a6b7a;color:#5a6b7a">疲劳 ${fat}</span>`:''}${drk>0?`<span class="tag" style="border-color:#8a3a5a;color:#8a3a5a">醉酒 ${drk}</span>`:''}${chaos>0?`<span class="tag" style="border-color:#8a4a5a;color:#8a4a5a">内息紊乱 ${chaos}</span>`:''}<span class="tag">内功 第${ng.level}层</span>${ng.bottleneck?`<span class="tag" style="border-color:#a0741f;color:#a0741f">内力瓶颈</span>`:''}<span class="tag">贡献 ${GAME.contribution}</span><span class="tag">到访 ${Object.keys(GAME.visited).length}/${Object.keys(WORLD_POS).length}</span><span class="tag">英雄坛胜场 ${GAME.flags.heroWins}</span>${GAME.flags.ending?`<p class="gold">已达成结局：${GAME.flags.ending}</p>`:''}</div>`;body.appendChild(btn(inj>0?'寻地打坐疗伤':'入定打坐修炼',()=>{closeModal('gameMenu');INK_openMeditate()},'primary'))}
/* 老参支线奖励：气血上限成长，但内伤封顶不变 */
X_SIDEQUESTS.ginseng.reward=()=>{removeItem('ginseng',2);addItem('great_heal',2);GAME.maxHp+=12;GAME.hp=Math.min(INK_effMaxHp(),GAME.hp+12)};

/* ===== 仙侠水墨版：状态玩法（饥饿闭环 · 米酒致醉 · 疲惫积累 · 状态联动） ===== */
/* 食物与酒接线：包子/干粮充饥、米酒致醉（改动仅补丁内，原版 ITEMS 不动） */
ITEMS.bun.satiety=20;
ITEMS.ration.satiety=35;
ITEMS.wine.satiety=5;
ITEMS.wine.drunk=15;
ITEMS.bun.desc='恢复少量气血与体力，可充饥。';
ITEMS.ration.desc='远行常备，最能果腹。';
ITEMS.wine.desc='入口温热，少饮提神，贪杯易醉。';

/* 状态速率常量：醒酒按实际游玩时间递减（约一杯米酒半分钟酒意渐消）；
   疾行积累疲惫，慢行/驻足缓释；客栈睡一觉与打坐静养可彻底消疲 */
const INK_DRUNK_DECAY=.3;
const INK_FAT_SPRINT=1.2;
const INK_FAT_WALK_REGEN=.25;
const INK_FAT_IDLE_REGEN=.8;

/* 疲惫过高（>50）：移速×0.9、体力回复×0.5（update 副本内使用） */
function INK_moveSpeedMul(){return (GAME.status.fatigue||0)>50?.9:1}
function INK_staRegenMul(){return (GAME.status.fatigue||0)>50?.5:1}

/* 原版 update 整体副本（与蓝本逐字一致，仅速度/体力回复处乘状态倍率） */
function update(dt){if(!GAME||!GAME.started||UI.modal||UI.dialog||COMBAT||(GAME.meditation&&GAME.meditation.active))return;GAME.playTime+=dt;RUNTIME.autosaveClock+=dt;RUNTIME.weatherClock+=dt;let dx=0,dy=0;if(INPUT.keys.has('arrowleft')||INPUT.keys.has('a'))dx-=1;if(INPUT.keys.has('arrowright')||INPUT.keys.has('d'))dx+=1;if(INPUT.keys.has('arrowup')||INPUT.keys.has('w'))dy-=1;if(INPUT.keys.has('arrowdown')||INPUT.keys.has('s'))dy+=1;dx+=INPUT.joy.x;dy+=INPUT.joy.y;let len=Math.hypot(dx,dy);if(len>.01){dx/=len;dy/=len;GAME.facing={x:dx,y:dy};let sprint=(INPUT.keys.has('shift')||INPUT.dash)&&GAME.sta>1,speed=(sprint?312:198)*INK_moveSpeedMul();if(sprint){GAME.sta=Math.max(0,GAME.sta-dt*4.8)}else GAME.sta=Math.min(GAME.maxSta,GAME.sta+dt*2.2*INK_staRegenMul());let nx=GAME.x+dx*speed*dt,ny=GAME.y+dy*speed*dt;if(canMove(nx,GAME.y))GAME.x=nx;if(canMove(GAME.x,ny))GAME.y=ny;GAME.steps+=speed*dt/55;if(chance(dt*3.5))RUNTIME.particles.push({x:GAME.x-dx*12,y:GAME.y-dy*8,vx:-dx*8+(Math.random()-.5)*15,vy:-dy*8+(Math.random()-.5)*15,life:.45,max:.45,size:3+Math.random()*4,color:'rgba(220,205,164,.35)',type:'dust'});if(GAME.steps>120){GAME.steps=0;GAME.time.minute+=3;if(GAME.time.minute>=1440){GAME.time.minute-=1440;GAME.time.day++}GAME.status.hunger=Math.min(100,GAME.status.hunger+.45);if(GAME.status.hunger>65)GAME.sta=Math.max(0,GAME.sta-1);RUNTIME.dirtyHud=true}}else GAME.sta=Math.min(GAME.maxSta,GAME.sta+dt*3.2*INK_staRegenMul());for(const n of RUNTIME.npcs){if(!n.alive||!n.wander)continue;n.phase+=dt*(.25+seeded(n.id.length)*.2);let tx=n.baseX+Math.sin(n.phase)*28,ty=n.baseY+Math.cos(n.phase*.83)*22;n.x=lerp(n.x,tx,dt*.45);n.y=lerp(n.y,ty,dt*.45)}checkPortals();findNearest();updateParticles(dt);updateQuestLogic();RUNTIME.camera.x=lerp(RUNTIME.camera.x,GAME.x,1-Math.pow(.001,dt));RUNTIME.camera.y=lerp(RUNTIME.camera.y,GAME.y,1-Math.pow(.001,dt));if(RUNTIME.weatherClock>35){RUNTIME.weatherClock=0;if(chance(.28))RUNTIME.weather=pick(['晴','晴','阴','小雨','薄雾'])}if(RUNTIME.autosaveClock>45&&GAME.settings.autoSave){RUNTIME.autosaveClock=0;saveSlot(0,true)}if(RUNTIME.dirtyHud)refreshHud()}

/* 身法修正：疲惫不堪（>80）与醉酒（>40）折损身法——
   命中/先手/闪避/逃跑全部经 derive()，一处生效，不必改命中公式；敌人不走 derive */
const INK_oldDerive=derive;
derive=function(){
 const d=INK_oldDerive();
 const st=(GAME&&GAME.status)||{};
 if((st.fatigue||0)>80)d.agi=Math.max(1,d.agi-2);
 if((st.drunk||0)>40)d.agi=Math.max(1,d.agi-3);
 return d;
};

/* 战斗疲惫：每回合结束积累 1~2 点 */
const INK_oldNextPlayerTurn=nextPlayerTurn;
nextPlayerTurn=function(){
 if(COMBAT){
  GAME.status.fatigue=Math.min(100,(GAME.status.fatigue||0)+1+Math.floor(Math.random()*2));
  INK_statusWarn();
 }
 INK_oldNextPlayerTurn();
};

/* 阈值提示（跨阈值一次性 toast；记录在 RUNTIME.statusPrev，向下回落自动重记） */
const INK_STATUS_THRESHOLDS={
 hunger:[[65,'饥肠辘辘，且寻些吃食'],[90,'饿得发昏，四肢无力']],
 fatigue:[[50,'渐感疲惫，脚步沉重'],[80,'疲惫不堪，身法大减']],
 drunk:[[40,'已有几分醉意，脚步轻浮'],[70,'酩酊大醉，踉跄难行']]
};
function INK_statusWarn(){
 if(!GAME||!GAME.started)return;
 const st=GAME.status||{};
 if(!RUNTIME.statusPrev){RUNTIME.statusPrev={hunger:st.hunger||0,fatigue:st.fatigue||0,drunk:st.drunk||0};return}
 for(const key in INK_STATUS_THRESHOLDS){
  const cur=st[key]||0,prev=RUNTIME.statusPrev[key]||0;
  for(const th of INK_STATUS_THRESHOLDS[key])if(cur>=th[0]&&prev<th[0])toast(th[1],'warn');
  RUNTIME.statusPrev[key]=cur;
 }
}
/* 状态逐帧推进（挂 loop，早退条件与原版 update 一致）：
   醒酒随时间流逝；疾行积疲、慢行缓释、驻足小憩；跨阈值提示；HUD 整数值变化刷脏 */
function INK_statusTick(dt){
 if(!GAME||!GAME.started||UI.modal||UI.dialog||COMBAT||(GAME.meditation&&GAME.meditation.active))return;
 const st=GAME.status;
 if(st.drunk===undefined)st.drunk=0;
 if(st.fatigue===undefined)st.fatigue=0;
 if(st.hunger===undefined)st.hunger=0;
 if(!RUNTIME.statusPrev)RUNTIME.statusPrev={hunger:st.hunger,fatigue:st.fatigue,drunk:st.drunk};
 if(st.drunk>0)st.drunk=Math.max(0,st.drunk-dt*INK_DRUNK_DECAY);
 let mvx=0,mvy=0;
 if(INPUT.keys.has('arrowleft')||INPUT.keys.has('a'))mvx-=1;
 if(INPUT.keys.has('arrowright')||INPUT.keys.has('d'))mvx+=1;
 if(INPUT.keys.has('arrowup')||INPUT.keys.has('w'))mvy-=1;
 if(INPUT.keys.has('arrowdown')||INPUT.keys.has('s'))mvy+=1;
 mvx+=INPUT.joy.x;mvy+=INPUT.joy.y;
 const moving=Math.hypot(mvx,mvy)>.01;
 if(moving&&(INPUT.keys.has('shift')||INPUT.dash)&&GAME.sta>1)st.fatigue=Math.min(100,st.fatigue+dt*INK_FAT_SPRINT);
 else if(moving)st.fatigue=Math.max(0,st.fatigue-dt*INK_FAT_WALK_REGEN);
 else st.fatigue=Math.max(0,st.fatigue-dt*INK_FAT_IDLE_REGEN);
 INK_statusWarn();
 const f=Math.floor(st.fatigue),d=Math.floor(st.drunk);
 if(RUNTIME._lastFat!==f||RUNTIME._lastDrunk!==d){RUNTIME._lastFat=f;RUNTIME._lastDrunk=d;RUNTIME.dirtyHud=true}
}

/* 新开一局重置状态提示记录（loadState 兜底已在其包装器内处理） */
const INK_oldStartNewStatus=startNew;
startNew=function(){RUNTIME.statusPrev=null;RUNTIME._lastFat=undefined;RUNTIME._lastDrunk=undefined;INK_oldStartNewStatus()};
try{$('#startBtn').onclick=startNew}catch(e){}

})();
</script>
